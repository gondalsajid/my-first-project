<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Monthly Bill Tracker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

        }


        .container {

            width: 100%;

            max-width: 520px;

            margin: auto;

            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.10);

        }


        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 25px;

            font-size: 28px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 16px;

        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            background: white;

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        button {

            width: 100%;

            padding: 15px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        button:active {

            transform: scale(0.98);

        }


        /* =================================
           PDF CUSTOMIZATION AREA
           ================================= */

        #pdfCustomization {

            margin-top: 25px;

            padding: 20px;

            background: #f4f6f8;

            border-radius: 14px;

        }


        #pdfCustomization h2 {

            margin-top: 0;

            font-size: 21px;

            text-align: center;

        }


        /* =================================
           REPORT AREA
           ================================= */

        #reportArea {

            display: none;

            margin-top: 25px;

        }


        #reportTitle {

            text-align: center;

            margin-bottom: 8px;

            font-size: 25px;

        }


        #reportSubtitle {

            text-align: center;

            margin-top: 0;

            margin-bottom: 15px;

            font-size: 18px;

            font-weight: normal;

        }


        #reportNote {

            text-align: center;

            margin-bottom: 20px;

            font-size: 15px;

        }


        .table-wrapper {

            width: 100%;

            overflow-x: auto;

        }


        .report-table {

            width: 100%;

            border-collapse: collapse;

            font-size: 13px;

            min-width: 600px;

        }


        .report-table th,
        .report-table td {

            border: 1px solid #ddd;

            padding: 8px;

            text-align: left;

        }


        .report-table th {

            font-weight: bold;

            background: #f4f6f8;

        }


        #totalArea {

            margin-top: 15px;

            padding: 15px;

            border-radius: 10px;

            background: #f4f6f8;

            font-weight: bold;

            line-height: 1.8;

        }


        @media (max-width: 400px) {

            body {

                padding: 10px;

            }


            .container {

                padding: 18px;

            }


            h1 {

                font-size: 24px;

            }

        }


        /* =================================
           PRINT / PDF
           ================================= */

        @media print {

            @page {

                size: A4;

                margin: 15mm;

            }


            body {

                padding: 0;

                margin: 0;

                background: white;

            }


            .container {

                width: 100%;

                max-width: 100%;

                padding: 0;

                margin: 0;

                box-shadow: none;

                border-radius: 0;

            }


            #entryForm,
            #pdfCustomization,
            #viewDetailsButton,
            #pdfButton {

                display: none !important;

            }


            #reportArea {

                display: block !important;

                margin: 0;

            }


            #reportTitle {

                margin-top: 0;

                font-size: 24px;

            }


            #reportSubtitle {

                font-size: 18px;

            }


            #reportNote {

                font-size: 14px;

            }


            .report-table {

                width: 100%;

                min-width: 0;

                font-size: 11px;

            }


            .report-table th,
            .report-table td {

                padding: 6px;

            }


            #totalArea {

                margin-top: 15px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>
            Monthly Bill Tracker
        </h1>


        <!-- =================================
             ENTRY FORM
             ================================= -->

        <div id="entryForm">


            <!-- BILL MONTH -->

            <div class="form-group">

                <label for="billMonth">
                    Bill Month
                </label>

                <input
                    type="month"
                    id="billMonth"
                >

            </div>


            <!-- REFERENCE NUMBER -->

            <div class="form-group">

                <label for="referenceNumber">
                    Reference Number
                </label>

                <select id="referenceNumber">

                    <option value="">
                        Select Reference Number
                    </option>

                    <option value="19126232328700">
                        19126232328700
                    </option>

                    <option value="19126232328701">
                        19126232328701
                    </option>

                    <option value="19126232328702">
                        19126232328702
                    </option>

                    <option value="19126232328703">
                        19126232328703
                    </option>

                    <option value="19126232328704">
                        19126232328704
                    </option>

                    <option value="19126232328705">
                        19126232328705
                    </option>

                    <option value="19126232328904">
                        19126232328904
                    </option>

                    <option value="16126232665528">
                        16126232665528
                    </option>

                    <option value="09410398680">
                        09410398680
                    </option>

                    <option value="62901460790">
                        62901460790
                    </option>

                </select>

            </div>


            <!-- BILL AMOUNT -->

            <div class="form-group">

                <label for="billAmount">
                    Bill Amount
                </label>

                <input
                    type="number"
                    id="billAmount"
                    placeholder="Enter bill amount"
                >

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="">
                        Select Status
                    </option>

                    <option value="Paid">
                        Paid
                    </option>

                    <option value="Unpaid">
                        Unpaid
                    </option>

                </select>

            </div>


            <!-- PAYMENT DATE -->

            <div class="form-group">

                <label for="paymentDate">
                    Payment Date
                </label>

                <input
                    type="date"
                    id="paymentDate"
                >

            </div>


            <!-- NOTES -->

            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Enter notes..."
                ></textarea>

            </div>


            <!-- SAVE -->

            <button
                type="button"
                id="saveButton"
            >
                Save Data
            </button>

        </div>


        <!-- =================================
             VIEW DETAILS
             ================================= -->

        <div class="form-group">

            <button
                type="button"
                id="viewDetailsButton"
            >
                View Details
            </button>

        </div>


        <!-- =================================
             PDF CUSTOMIZATION
             ================================= -->

        <div id="pdfCustomization">


            <h2>
                PDF Customization
            </h2>


            <!-- PDF TITLE -->

            <div class="form-group">

                <label for="pdfTitleInput">
                    PDF Title
                </label>

                <input
                    type="text"
                    id="pdfTitleInput"
                    value="Monthly Electricity Bill Report"
                    placeholder="Enter PDF title"
                >

            </div>


            <!-- PDF SUBTITLE -->

            <div class="form-group">

                <label for="pdfSubtitleInput">
                    Subtitle / Building Name
                </label>

                <input
                    type="text"
                    id="pdfSubtitleInput"
                    placeholder="Example: Al Noor Building"
                >

            </div>


            <!-- PDF ADDITIONAL NOTE -->

            <div class="form-group">

                <label for="pdfNoteInput">
                    Additional Note
                </label>

                <textarea
                    id="pdfNoteInput"
                    placeholder="Enter additional note for PDF..."
                ></textarea>

            </div>

        </div>


        <!-- =================================
             CREATE PDF
             ================================= -->

        <div class="form-group">

            <button
                type="button"
                id="pdfButton"
            >
                Create PDF
            </button>

        </div>


        <!-- =================================
             REPORT AREA
             ================================= -->

        <div id="reportArea">


            <h2 id="reportTitle">
                Monthly Electricity Bill Report
            </h2>


            <h3 id="reportSubtitle">
            </h3>


            <div id="reportNote">
            </div>


            <div class="table-wrapper">

                <div id="reportTableContainer">
                </div>

            </div>


            <div id="totalArea">
            </div>


        </div>


    </div>


    <!-- =================================
         EXTERNAL JAVASCRIPT
         ================================= -->

    <script src="script.js"></script>


</body>

</html>
